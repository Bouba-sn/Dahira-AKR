<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Générer les icons PWA</title>
    <style>
        body { font-family: sans-serif; padding: 20px; background: #1e3a8a; color: white; text-align: center; }
        .icon-container { display: flex; flex-wrap: wrap; justify-content: center; gap: 20px; margin-top: 20px; }
        .icon { background: #1e3a8a; border-radius: 15%; padding: 10px; display: flex; flex-direction: column; align-items: center; gap: 10px; }
        .icon img { border-radius: 15%; object-fit: cover; }
        .icon span { font-size: 12px; }
        button { padding: 15px 30px; font-size: 18px; background: #22c55e; color: white; border: none; border-radius: 10px; cursor: pointer; margin-top: 20px; }
    </style>
</head>
<body>
    <h1>Icons PWA - Dahira AKR</h1>
    <p>Cliquez sur chaque image pour la télécharger</p>
    <div class="icon-container" id="icons"></div>
    <button onclick="downloadAll()">Télécharger tout</button>
    <script>
        const sizes = [72, 96, 128, 192, 512];
        const img = new Image();
        img.crossOrigin = 'anonymous';
        img.src = '/assets/uploads/1.jpg';
        img.onload = () => {
            const container = document.getElementById('icons');
            sizes.forEach(size => {
                const canvas = document.createElement('canvas');
                canvas.width = size;
                canvas.height = size;
                const ctx = canvas.getContext('2d');
                
                ctx.fillStyle = '#1e3a8a';
                ctx.fillRect(0, 0, size, size);
                
                const circleSize = size * 0.85;
                const x = (size - circleSize) / 2;
                const y = (size - circleSize) / 2;
                
                ctx.beginPath();
                ctx.ellipse(size/2, size/2, circleSize/2, circleSize/2, 0, 0, Math.PI * 2);
                ctx.closePath();
                ctx.clip();
                
                ctx.drawImage(img, x, y, circleSize, circleSize);
                
                const link = document.createElement('a');
                link.download = `icon-${size}x${size}.png`;
                link.href = canvas.toDataURL('image/png');
                link.innerHTML = `<img src="${link.href}" width="${size}" height="${size}"><span>${size}x${size}</span>`;
                link.className = 'icon';
                container.appendChild(link);
            });
        };
        
        function downloadAll() {
            document.querySelectorAll('.icon a').forEach(a => a.click());
        }
    </script>
</body>
</html>
